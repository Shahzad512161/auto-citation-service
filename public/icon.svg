<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08338F" />
      <stop offset="50%" stop-color="#0F6FFF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Rocket Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Metallic Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" />

  <!-- Global Citation Grid & Orbit -->
  <!-- Latitude Ellipse -->
  <ellipse cx="32" cy="36" rx="22" ry="9" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="3 3" fill="none" transform="rotate(-20 32 36)" />
  <!-- Longitude Arc -->
  <path d="M16 48 C 22 36, 26 24, 38 14" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" fill="none" />
  
  <!-- Global Citation Node Beacons (Dots) -->
  <circle cx="16" cy="42" r="1.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="48" cy="28" r="1.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="42" cy="45" r="1.8" fill="#FDE047" opacity="0.9" />
  <circle cx="21" cy="25" r="1.2" fill="#FFFFFF" opacity="0.6" />

  <!-- Rocket Propulsion Blast (Flames) -->
  <path d="M23 41 L14 50 C 13.5 50.5, 17 48, 19 45 L23 41 Z" fill="url(#flameGrad)" filter="url(#glow)" />
  <path d="M25 43 L18 52 C 19 49, 23 46, 25 43 Z" fill="#FDE047" />

  <!-- Rocket Wings -->
  <!-- Left Wing -->
  <path d="M27 34 L21 41 L27 41 Z" fill="url(#wingGrad)" />
  <!-- Right Wing -->
  <path d="M34 27 L41 33 L41 39 L37 36 Z" fill="url(#wingGrad)" />

  <!-- Rocket Fuselage (Streamlined Body) -->
  <path d="M47 17 C 47 17, 36 21, 28 30 C 26 32, 25 36, 25 39 L31 39 C 34 39, 38 38, 40 36 C 49 28, 47 17, 47 17 Z" fill="#FFFFFF" />

  <!-- Rocket Cockpit Window / Location Pin Beacon -->
  <circle cx="38" cy="26" r="3.2" fill="#0F6FFF" />
  <circle cx="38" cy="26" r="1.3" fill="#FFFFFF" />

  <!-- Supersonic Spark / Stars -->
  <path d="M49 13 L51 15 L49 17 L47 15 Z" fill="#FFFFFF" opacity="0.95" />
  <circle cx="53" cy="22" r="1" fill="#FDE047" />
</svg>
